; stm32f746g-disco: UM1907: LCD FT5336 and WM8994 share I2C3. Onboard pull-ups. FT5336 unshifted address 0x38.
; I2C uses AF4 open-drain; pull=none relies on real external resistors.
; 0x50 on extension headers is an example target address, not an onboard device.

[touch_i2c_scl]
driver_name=dmgpio
driver_order=10
friends_group=touch_i2c
pin=PH7
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[touch_i2c_sda]
driver_name=dmgpio
driver_order=10
friends_group=touch_i2c
pin=PH8
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[touch_i2c]
driver_name=dmi2c
driver_order=11
friends_group=touch_i2c
instance=3
role=master
address=56
baudrate=100000
timeout_ms=100

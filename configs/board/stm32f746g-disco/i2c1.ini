; stm32f746g-disco: UM1907: CN5 pin 10 D15=SCL, pin 9 D14=SDA. External target and pull-ups required.
; I2C uses AF4 open-drain; pull=none relies on real external resistors.
; 0x50 on extension headers is an example target address, not an onboard device.

[arduino_i2c_scl]
driver_name=dmgpio
driver_order=10
friends_group=arduino_i2c
pin=PB8
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[arduino_i2c_sda]
driver_name=dmgpio
driver_order=10
friends_group=arduino_i2c
pin=PB9
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[arduino_i2c]
driver_name=dmi2c
driver_order=11
friends_group=arduino_i2c
instance=1
role=master
address=80
baudrate=100000
timeout_ms=100

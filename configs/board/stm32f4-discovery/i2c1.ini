; stm32f4-discovery: UM1472/MB997: CS43L22 control bus. Onboard 4.7k pull-ups. Release PD4 reset separately before codec access.
; This config does not initialize audio clocks, I2S, or release the codec reset.
; I2C uses AF4 open-drain; pull=none relies on real external resistors.
; 0x50 on extension headers is an example target address, not an onboard device.

[audio_i2c_scl]
driver_name=dmgpio
driver_order=10
friends_group=audio_i2c
pin=PB6
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[audio_i2c_sda]
driver_name=dmgpio
driver_order=10
friends_group=audio_i2c
pin=PB9
mode=alternate
alternate_function=4
speed=maximum
output_circuit=open_drain
pull=none

[audio_i2c]
driver_name=dmi2c
driver_order=11
friends_group=audio_i2c
instance=1
role=master
address=74
baudrate=100000
timeout_ms=100

; Elecrow DIS08070H (CrowPanel 7.0", ESP32-S3-WROOM-1-N4R8): the I2C bus of the board is SCL = GPIO20, SDA = GPIO19 (the pads of the USB of
; the chip: no USB connector is wired to them). On the bus (scanned 0x08-0x77 on the board, see docs/validation/elecrow-dis08070h.txt):
; the PCA9557 expander at 0x18 (the reset and the INT of the touch panel) and the touch controller GT911 at 0x5D. Select this file OR
; another board's, never both.
; The pull-ups of the board do the work; the internal ones (45 kOhm) are enabled too.
; address is the default target of read/write on the node; use the ioctls (dmi2c_ioctl_cmd_probe, ..._transfer) for the others.
[i2c]
driver_name=dmi2c
driver_order=11
instance=1
role=master
address=24
baudrate=100000
timeout_ms=100
scl_pin=20
sda_pin=19

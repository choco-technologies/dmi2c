; Waveshare ESP32-S3-Touch-LCD-2.8: the I2C bus of the board is SCL = GPIO10, SDA = GPIO11 (the I2C header and the chips on the
; board: the touch controller, the QMI8658 IMU, the PCF85063 RTC, ...). Select this file OR another board's, never both.
; The pull-ups of the board do the work; the internal ones (45 kOhm) are enabled too.
; address is the default target of read/write on the node; use the ioctls (dmi2c_ioctl_cmd_probe, ..._transfer) for the others.
[i2c]
driver_name=dmi2c
driver_order=11
instance=1
role=master
address=81
baudrate=100000
timeout_ms=100
scl_pin=10
sda_pin=11
